<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotivBom Studio</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#101214;color:#f4f4f5;font:16px system-ui;padding:18px}h1{font-size:26px}.grid{display:grid;gap:10px}.card,textarea,input,button{border-radius:14px;border:1px solid #30343a;background:#191c20;color:inherit;padding:14px}button{font-weight:700;text-align:left}.chosen{border-color:#56d58a;background:#153122}.hide{display:none}textarea{box-sizing:border-box;width:100%;min-height:150px;margin:12px 0}input{box-sizing:border-box;width:100%;margin:6px 0}#result{white-space:pre-wrap;line-height:1.45;padding:8px 2px}.muted{color:#a3a9b3;font-size:13px}</style></head><body><h1>MotivBom Studio</h1><p class="muted">Выбери агента. Результат можно сразу передать следующему.</p><div class="grid" id="cards"><button data-agent="analyst">🔎 1. Аналитик роликов<br><span class="muted">Видео + реальные просмотры → косяки и выводы</span></button><button data-agent="scriptwriter">✍️ 2. Сценарист<br><span class="muted">Отчёт → 3 сценария Reels</span></button><button data-agent="director">🎬 3. Контент-директор<br><span class="muted">Сценарий → упаковка, CTA, A/B-тест</span></button></div><section id="form" class="hide"><h2 id="title"></h2><div id="fields"></div><textarea id="context" placeholder="Вставь отчёт или задачу"></textarea><input id="video" class="hide" type="file" accept="video/mp4,video/quicktime"><button id="run">Запустить агента</button><p class="muted" id="hint"></p></section><section id="out" class="hide"><h2>Результат</h2><div id="result"></div><button id="next" class="hide">Передать следующему агенту →</button></section><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let agent='',last='';const labels={analyst:'Аналитик',scriptwriter:'Сценарист',director:'Контент-директор'},next={analyst:'scriptwriter',scriptwriter:'director'};document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>choose(b.dataset.agent));function choose(a,preset=''){agent=a;title.textContent=labels[a];form.classList.remove('hide');out.classList.add('hide');context.value=preset;video.classList.toggle('hide',a!=='analyst');hint.textContent=a==='analyst'?'Прикрепи MP4 для честного разбора кадров. Добавь метрики ниже.':'Вставь результат предыдущего агента или свою задачу.';fields.innerHTML=a==='analyst'?'<input name="views" placeholder="Просмотры"><input name="likes" placeholder="Лайки"><input name="comments" placeholder="Комментарии"><input name="shares" placeholder="Репосты"><input name="saves" placeholder="Сохранения">':''}run.onclick=async()=>{run.disabled=true;run.textContent='Агент думает…';const fd=new FormData();fd.append('context',context.value);fd.append('init_data',tg?.initData||'');document.querySelectorAll('#fields input').forEach(i=>fd.append(i.name,i.value));if(video.files[0])fd.append('video',video.files[0]);try{const r=await fetch('/api/agents/'+agent,{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');last=d.answer;result.textContent=last;out.classList.remove('hide');next.classList.toggle('hide',!next[agent]);}catch(e){alert(e.message)}finally{run.disabled=false;run.textContent='Запустить агента'}};next.onclick=()=>choose(next[agent],last);</script></body></html>
